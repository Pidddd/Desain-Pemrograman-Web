<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SIMPUS-Mini | Daftar Buku</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>

  <body>
    <header>
      <h1>SIMPUS-Mini</h1>
      <!-- <input type="checkbox" id="nav-toggle" class="nav-toggle" />
      <label for="nav-toggle" class="nav-toggle-label">&#9776;</label> -->
      <button
        type="button"
        id="nav-toggle-btn"
        class="nav-toggle-label"
        aria-label="Menu"
      >
        &#9776;
      </button>
      <nav>
        <ul>
          <li><a href="../index.html">Beranda</a></li>
          <li><a href="list.html">Daftar Buku</a></li>
          <li><a href="tambah.html">Tambah Buku</a></li>
          <li><a href="../anggota/list.html">Daftar Anggota</a></li>
          <li><a href="../anggota/tambah.html">Tambah Anggota</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <div class="search-box">
          <label for="search-input">Cari Data</label>
          <input
            type="text"
            id="search-input"
            placeholder="Ketik kata kunci..."
          />
        </div>
        <p id="loading-indicator" style="display: none">Memuat data...</p>
        <p
          id="counter"
          style="margin-bottom: 10px; font-weight: 600; color: #547a95"
        ></p>

        <button
          type="button"
          id="btn-muat-ulang"
          style="margin-bottom: 10px; cursor: pointer"
        >
          Muat Ulang Data
        </button>
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>Judul</th>
                <th>Pengarang</th>
                <th>Tahun</th>
                <th>Stok</th>
                <th>Kategori</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody>
              <!-- Baris diisi dinamis oleh assets/js/buku.js via fetch('../data/buku.json') -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <footer>
      <p>© 2026 SIMPUS-Mini — Jobsheet 6</p>
    </footer>

    <script src="../assets/js/app.js"></script>
    <!-- <script src="../assets/js/buku.js"></script> -->
    <script src="../assets/js/tabel.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        muatDataTabel("../data/buku.json", [
          "judul",
          "pengarang",
          "tahun",
          "stok",
          "Kategori",
        ]);
      });
    </script>
  </body>
</html>
